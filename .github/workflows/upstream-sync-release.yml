name: Sync Upstream & Publish Custom Release

on:
  schedule:
    # Automatically check official storytold/pdfcraft upstream channel every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream tag or branch to sync (default: latest release tag)"
        required: false
        default: ""
      force_rebuild:
        description: "Rebuild and re-upload release assets even if tag is already published"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: upstream-sync-release
  cancel-in-progress: false

jobs:
  check-upstream:
    name: Check Official Upstream Release (storytold/pdfcraft)
    runs-on: ubuntu-latest
    outputs:
      target_tag: ${{ steps.probe.outputs.target_tag }}
      needs_build: ${{ steps.probe.outputs.needs_build }}
    steps:
      - name: Compare Upstream Release Against Custom Repository
        id: probe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_REF: ${{ inputs.upstream_ref }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_REF}" ]]; then
            TARGET_TAG="${REQUESTED_REF}"
          else
            TARGET_TAG="$(gh api repos/storytold/pdfcraft/releases/latest --jq '.tag_name')"
          fi
          echo "Latest official upstream release tag: ${TARGET_TAG}"
          echo "target_tag=${TARGET_TAG}" >> "${GITHUB_OUTPUT}"

          if [[ "${FORCE_REBUILD}" == "true" ]]; then
            echo "needs_build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if gh release view "${TARGET_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' 2>/dev/null | grep -q -- '-windows-x64-portable\.zip$'; then
            echo "Release ${TARGET_TAG} is already published on ${GITHUB_REPOSITORY}. Skipping Windows build."
            echo "needs_build=false" >> "${GITHUB_OUTPUT}"
          else
            echo "New upstream release ${TARGET_TAG} requires merge & Windows build."
            echo "needs_build=true" >> "${GITHUB_OUTPUT}"
          fi

  sync-and-release:
    name: Merge Upstream PdfCraft + Build Full Portable Package
    needs: check-upstream
    if: needs.check-upstream.outputs.needs_build == 'true'
    runs-on: windows-latest
    env:
      TARGET_TAG: ${{ needs.check-upstream.outputs.target_tag }}
    steps:
      - name: Checkout Custom Enterprise Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge Official Upstream Tag (storytold/pdfcraft)
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/storytold/pdfcraft.git
          git fetch upstream --tags --prune

          git merge-base --is-ancestor "$env:TARGET_TAG" HEAD
          if ($LASTEXITCODE -ne 0) {
            git merge "$env:TARGET_TAG" --no-edit -m "chore(sync): merge official upstream $env:TARGET_TAG into Enterprise Multi-Printer Edition"
            if ($LASTEXITCODE -ne 0) {
              $Unmerged = @(git diff --name-only --diff-filter=U | Where-Object { ![string]::IsNullOrWhiteSpace($_) })
              $OnlyVersionFiles = ($Unmerged.Count -gt 0) -and (($Unmerged | Where-Object { $_ -notin @("Cargo.toml", "Cargo.lock") }).Count -eq 0)
              $Resolved = $false
              if ($OnlyVersionFiles) {
                $CanResolveToml = $true
                if ($Unmerged -contains "Cargo.toml") {
                  $RawToml = [System.IO.File]::ReadAllText("Cargo.toml")
                  $ConflictPattern = '(?ms)^<<<<<<< [^\r\n]*\r?\n(.*?)^=======\r?\n(.*?)^>>>>>>> [^\r\n]*\r?\n?'
                  $MatchesList = [regex]::Matches($RawToml, $ConflictPattern)
                  $VerLinePattern = '^\s*version\s*=\s*"(\d+\.\d+\.\d+)"\s*$'
                  if ($MatchesList.Count -eq 0) { $CanResolveToml = $false }
                  foreach ($M in $MatchesList) {
                    if (($M.Groups[1].Value.TrimEnd("`r", "`n") -notmatch $VerLinePattern) -or ($M.Groups[2].Value.TrimEnd("`r", "`n") -notmatch $VerLinePattern)) {
                      $CanResolveToml = $false
                    }
                  }
                  if ($CanResolveToml) {
                    $ResolvedToml = [regex]::Replace($RawToml, $ConflictPattern, {
                      param($Match)
                      $OursLine = $Match.Groups[1].Value.TrimEnd("`r", "`n")
                      $TheirsLine = $Match.Groups[2].Value.TrimEnd("`r", "`n")
                      $OursVer = [version]([regex]::Match($OursLine, '"(\d+\.\d+\.\d+)"').Groups[1].Value)
                      $TheirsVer = [version]([regex]::Match($TheirsLine, '"(\d+\.\d+\.\d+)"').Groups[1].Value)
                      $NL = if ($Match.Value.Contains("`r`n")) { "`r`n" } else { "`n" }
                      if ($TheirsVer -ge $OursVer) { return ($TheirsLine + $NL) } else { return ($OursLine + $NL) }
                    })
                    [System.IO.File]::WriteAllText("Cargo.toml", $ResolvedToml, (New-Object System.Text.UTF8Encoding($false)))
                    git add Cargo.toml
                  }
                }
                if ($CanResolveToml) {
                  if ($Unmerged -contains "Cargo.lock") {
                    git checkout --theirs Cargo.lock
                  }
                  cargo metadata --format-version 1 *> $null
                  if ($LASTEXITCODE -eq 0) {
                    git add Cargo.lock
                    git commit --no-edit -m "chore(sync): merge official upstream $env:TARGET_TAG into Enterprise Multi-Printer Edition (SemVer max)"
                    if ($LASTEXITCODE -eq 0) { $Resolved = $true }
                  }
                }
              }
              if (-not $Resolved) {
                git merge --abort
                throw "Automatic merge encountered a non-version conflict with $env:TARGET_TAG."
              }
            }
            git push origin HEAD:main
          }
          git push origin "HEAD:refs/tags/$env:TARGET_TAG" --force

      - name: Install Rust 1.95 Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify Architecture Layers & Multi-Printer Suite
        shell: pwsh
        run: |
          cargo run -p xtask -- layers
          cargo test -p pdfcraft-print --lib
          cargo test -p pdfcraft-platform --lib
          cargo test -p pdfcraft-engine --test print_coordinator_tests
          cargo test -p pdfcraft-ui-egui --lib platform::custom_update

      - name: Build Full Portable Package (GUI + CLI + OCR Models + Channel Config)
        shell: pwsh
        run: |
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS = "-C target-feature=+crt-static"
          $env:PDFCRAFT_REQUIRE_WINRES = "1"
          cargo build --release -p pdfcraft -p pdfcraft-cli --target x86_64-pc-windows-msvc

          $Ver = (cargo pkgid -p pdfcraft | ForEach-Object { ($_ -split '[#@]')[-1] }).Trim()
          $AssetStem = "pdfcraft-$Ver-windows-x64-portable"
          $PackRoot = Join-Path $env:RUNNER_TEMP $AssetStem
          New-Item -ItemType Directory -Path $PackRoot -Force | Out-Null

          $BinDir = "target\x86_64-pc-windows-msvc\release"
          Copy-Item "$BinDir\pdfcraft.exe", "$BinDir\pdfcraft-cli.exe" -Destination $PackRoot -Force

          $ModelsDir = Join-Path $PackRoot "models"
          New-Item -ItemType Directory -Path $ModelsDir -Force | Out-Null
          cargo run -p xtask -- models $ModelsDir
          Remove-Item -Force (Join-Path $ModelsDir "*.part") -ErrorAction SilentlyContinue

          Copy-Item "packaging\windows\portable.txt" -Destination (Join-Path $PackRoot "portable.txt") -Force
          if (Test-Path "docs\PORTABLE-README-AR.txt") {
            Copy-Item "docs\PORTABLE-README-AR.txt" -Destination (Join-Path $PackRoot "README-AR.txt") -Force
          }
          foreach ($f in @("README.md", "NOTICE", "LICENSE-MIT", "LICENSE-APACHE")) {
            if (Test-Path $f) { Copy-Item $f -Destination $PackRoot -Force }
          }
          if (Test-Path "assets\app-icon\LICENSE-document.txt") {
            Copy-Item "assets\app-icon\LICENSE-document.txt" -Destination (Join-Path $PackRoot "LICENSE-document.txt") -Force
          }

          $ChannelJson = [ordered]@{
            upstream_repo = "storytold/pdfcraft"
            custom_repo   = "${{ github.repository }}"
          } | ConvertTo-Json -Depth 3
          Set-Content -Path (Join-Path $PackRoot "update_channel.json") -Value $ChannelJson -Encoding UTF8

          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $ZipName = "$AssetStem.zip"
          $ZipPath = Join-Path $env:RUNNER_TEMP $ZipName
          $AliasZipPath = Join-Path $env:RUNNER_TEMP "PdfCraft-Portable.zip"

          $ResolvedRoot = (Resolve-Path $PackRoot).Path.TrimEnd('\', '/')
          $Fs = [System.IO.File]::Open($ZipPath, [System.IO.FileMode]::CreateNew)
          try {
            $Archive = New-Object System.IO.Compression.ZipArchive($Fs, [System.IO.Compression.ZipArchiveMode]::Create, $false)
            try {
              foreach ($File in (Get-ChildItem -LiteralPath $ResolvedRoot -Recurse -File)) {
                $Rel = $File.FullName.Substring($ResolvedRoot.Length).TrimStart('\', '/') -replace '\\', '/'
                [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
                  $Archive,
                  $File.FullName,
                  "$AssetStem/$Rel",
                  [System.IO.Compression.CompressionLevel]::Optimal
                ) | Out-Null
              }
            } finally { $Archive.Dispose() }
          } finally { $Fs.Dispose() }

          Copy-Item -LiteralPath $ZipPath -Destination $AliasZipPath -Force

          $Sha = (Get-FileHash -Path $ZipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $SumsPath = Join-Path $env:RUNNER_TEMP "SHA256SUMS.txt"
          $SumsBody = "$Sha  $ZipName`n$Sha  PdfCraft-Portable.zip`n"
          [System.IO.File]::WriteAllText($SumsPath, $SumsBody, [System.Text.Encoding]::ASCII)

          "ZIP_PATH=$ZipPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ALIAS_ZIP_PATH=$AliasZipPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SUMS_PATH=$SumsPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_VER=$Ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish Combined GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $Tag = $env:TARGET_TAG
          $Notes = "Merged official upstream ``storytold/pdfcraft`` **$Tag** with **Enterprise Multi-Printer Cluster Engine** (simultaneous multi-printer dispatch, true K-only monochrome, hardware margin auto-fit, pre-flight capability checks, zero-copy ``SharedPdfSource``, one-click failover rerouting, and diagnostic telemetry).`n`n### Included in Full Portable Package:`n- ``pdfcraft.exe`` (Desktop GUI + Multi-Printer Engine + Auto-Updater)`n- ``pdfcraft-cli.exe`` (Command-Line Tool)`n- ``models/`` (Offline OCR Models, SHA-256 Verified)`n- ``portable.txt`` & ``update_channel.json`` & ``README-AR.txt```n`nUpstream changelog: https://github.com/storytold/pdfcraft/releases/tag/$Tag"
          $Exists = gh release view $Tag --json tagName 2>$null
          if ($Exists) {
            gh release upload $Tag "$env:ZIP_PATH" "$env:ALIAS_ZIP_PATH" "$env:SUMS_PATH" --clobber
          } else {
            gh release create $Tag "$env:ZIP_PATH" "$env:ALIAS_ZIP_PATH" "$env:SUMS_PATH" --title "PdfCraft $env:RELEASE_VER (Enterprise Multi-Printer Full Package)" --notes "$Notes"
          }
