[package]
name = "pdfcraft-print"
description = "Printing: page selection, sizing (fit, actual, shrink, custom), multiple pages per sheet, booklets, posters, comments & forms; print-ready PDF and the system spooler"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
craft-cms = { workspace = true }
craft-print = { workspace = true }
log = { workspace = true }
pdfcraft-cos = { workspace = true }
pdfcraft-content = { workspace = true }
pdfcraft-filters = { workspace = true }
pdfcraft-model = { workspace = true }
roxmltree = "0.21"
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
tempfile = "3.27"
winprint = { version = "0.2.1", git = "https://github.com/storytold/winprint.rs", rev = "bc06a7c48b768eb27a828c7986f6d2868b245ee0", default-features = false }

[dev-dependencies]
pdfcraft-render = { workspace = true }
# Reads the renamed programs back with a parser that isn't ours.
skrifa = "0.44"
